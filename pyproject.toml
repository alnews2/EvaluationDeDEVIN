[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calculatrice"
version = "0.1.0"
description = "Calculatrice de bureau (quatre opérations) en Python / Qt"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dropit", email = "dropit@yopmail.com" }]
keywords = ["calculatrice", "qt", "pyside6", "gui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-qt>=4.5.0",
  "pytest-cov>=7.1.0",
  "mypy>=2.3.1",
  "ruff>=0.16.7",
  "pre-commit>=4.6.2",
]

[project.gui-scripts]
calculatrice = "calculatrice.app:main"

[project.urls]
Repository = "https://github.com/alnews2/EvaluationDeDEVIN"

[tool.hatch.build.targets.wheel]
packages = ["src/calculatrice"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "A",   # builtins shadowing
  "C4",  # comprehensions
  "SIM", # simplify
  "PTH", # pathlib
  "RUF",
  "D",   # pydocstyle
  "ANN", # annotations
]
ignore = ["D203", "D213"]
# Les symboles typographiques des opérateurs sont volontaires.
allowed-confusables = ["−", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = []
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["pytestqt.*"]
ignore_missing_imports = true

# pytest-qt n'annote pas ses méthodes d'interaction (mouseClick, keyClick...).
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=calculatrice",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=100",
]
markers = ["gui: tests nécessitant une boucle d'évènements Qt"]

[tool.coverage.run]
branch = true
source = ["src/calculatrice"]
omit = ["src/calculatrice/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']
