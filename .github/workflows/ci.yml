name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  qualite:
    name: Qualité (lint, format, typage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Installation
        run: uv pip install --system -e ".[dev]"
      - name: Format
        run: ruff format --check --diff .
      - name: Lint
        run: ruff check --output-format=github .
      - name: Typage strict
        run: mypy

  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Dépendances système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-sync1 libxcb-xfixes0
      - name: Installation
        run: uv pip install --system -e ".[dev]"
      - name: Tests et couverture
        run: pytest
      - name: Publication du rapport de couverture
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage.xml
          if-no-files-found: error

  paquet:
    name: Construction du paquet
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Construction
        run: uv build
      - name: Vérification de l'installation du wheel
        run: |
          uv venv /tmp/verif
          VIRTUAL_ENV=/tmp/verif uv pip install dist/*.whl
          VIRTUAL_ENV=/tmp/verif /tmp/verif/bin/python -c "import calculatrice; print(calculatrice.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error
