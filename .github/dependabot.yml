version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      outils-de-developpement:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
